name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  test-and-lint:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  build-and-release:
    name: Build APK & Publish Release
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/LyricsStatus-v0.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricsStatus-v0.1-apk
          path: release-artifacts/LyricsStatus-v0.1.apk
          retention-days: 30

      - name: Create or Update GitHub Release v0.1
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1
          name: "LyricsStatus v0.1"
          draft: false
          prerelease: false
          body: |
            ## 🎵 LyricsStatus v0.1 — Versión Inicial / Initial Release

            Aplicación nativa para Android escrita en **Kotlin**, **Jetpack Compose** y **Material Design 3**, con sincronización en tiempo real a Discord y traducción por IA.

            ### 🚀 Características Principales:
            - **100% Nativo en Android:** Ejecución totalmente autónoma en el dispositivo, con soporte completo en segundo plano mediante Foreground Service y MediaSession.
            - **Sincronización en Tiempo Real con Discord:** Actualización instantánea del estado personalizado de Discord (`PATCH /api/v9/users/@me/settings`) con letra sincronizada, emojis personalizados/unicode y auto-offset de latencia.
            - **Sincronización en Segundo Plano:** Notificación interactiva (`LyricsForegroundService`) con canción, artista, línea activa sincronizada y traducción bilingüe.
            - **Detección Automática de Reproductores & Discord Gateway:** Detección en vivo de Spotify, Apple Music, YouTube Music, Deezer, Tidal, Poweramp, VLC, o actividad de Spotify en Discord.
            - **Traducción con IA Multimodelo:**
              - **Google Gemini:** `gemini-3.5-flash-lite` *(predeterminado)*, `gemini-2.5-flash`, `gemini-2.5-pro`, `gemini-2.0-flash`.
              - **OpenAI / ChatGPT:** `gpt-4.5-preview`, `gpt-4o`, `gpt-4o-mini`, `o3-mini`.
              - **Anthropic Claude:** `claude-3-7-sonnet-20250219`, `claude-3-5-haiku`, `claude-3-5-sonnet`.
              - **xAI Grok:** `grok-3`, `grok-2-latest`.
              - **Custom Endpoint & Modelo Personalizado:** Soporte para Ollama, vLLM, LMStudio o cualquier modelo escrito manualmente.
            - **Pipeline de Letras Sincronizadas:** Letras personalizadas -> Caché en disco -> LrcLib -> NetEase -> QQ Music.
            - **Internacionalización:** Interfaz y recursos localizados al Español e Inglés.
            - **Iconografía Material 3:** Íconos vectoriales del sistema sin emojis en la UI.
          files: |
            release-artifacts/LyricsStatus-v0.1.apk
